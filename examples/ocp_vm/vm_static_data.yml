---
# OpenShift Virtualization ROS usage data for ros-ocp-backend.
#
# Generates ocp_ros_vm_usage.csv with 15-minute interval samples.
#
#   nise report ocp --static-report-file examples/ocp_vm/vm_static_data.yml \
#     --ocp-cluster-id <YOUR-CLUSTER-UUID> --ros-ocp-info \
#     -s 2026-05-01 -e 2026-05-03 -w
#
# VM-only (no pod/cost reports):
#   nise report ocp --static-report-file examples/ocp_vm/vm_static_data.yml \
#     --ocp-cluster-id <YOUR-CLUSTER-UUID> -s 2026-05-01 -e 2026-05-03 -w
#
generators:
  - OCPVirtualMachineGenerator:
      start_date: 2026-05-01
      end_date: 2026-05-03
      vms:
        # Active Linux VM with guest agent
        - vm_name: web-server-linux-01
          namespace: production
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
        # Idle Linux VM with guest agent
        - vm_name: idle-vm-linux-01
          namespace: dev
          node_name: worker-3
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 40
          idle: true
        # Active Windows VM with guest agent
        - vm_name: db-server-windows-01
          namespace: production
          node_name: worker-2
          guest_os: windows
          guest_agent: true
          vcpu: 8
          memory_gib: 32
          disk_gib: 500
        # Active Linux VM without guest agent (empty guest-agent columns)
        - vm_name: legacy-app-01
          namespace: legacy
          node_name: worker-1
          guest_os: linux
          guest_agent: false
          vcpu: 2
          memory_gib: 4
          disk_gib: 50
        # Idle Windows VM without guest agent
        - vm_name: idle-windows-legacy-01
          namespace: legacy
          node_name: worker-2
          guest_os: windows
          guest_agent: false
          vcpu: 2
          memory_gib: 4
          disk_gib: 50
          idle: true
        # Guest agent appears 2 hours after report start (late install scenario)
        - vm_name: late-agent-install-vm
          namespace: production
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          agent_install_hour: 2
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
        # Guest agent for first 5 days only (removal scenario)
        - vm_name: agent-removed-vm
          namespace: staging
          node_name: worker-2
          guest_os: linux
          guest_agent: false
          agent_remove_day: 5
          vcpu: 2
          memory_gib: 4
          disk_gib: 50
        # Crash loop VM: elevated restart_count for ROS crash-loop notification (code 48)
        - vm_name: crash-loop-vm-01
          namespace: production
          node_name: worker-2
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
          crash_loop: true
        # Abandoned VM: zero CPU and memory usage for abandoned detection (ROS code 43)
        - vm_name: abandoned-test-vm-01
          namespace: forgotten-project
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 50
          abandoned: true
