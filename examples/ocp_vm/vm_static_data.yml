---
# OpenShift Virtualization ROS usage data for ros-ocp-backend.
#
# Generates ocp_ros_vm_usage.csv with 15-minute interval samples.
#
#   nise report ocp --static-report-file examples/ocp_vm/vm_static_data.yml \
#     --ocp-cluster-id <YOUR-CLUSTER-UUID> --ros-ocp-info \
#     -s 2026-05-01 -e 2026-05-03 -w
#
# VM-only (no pod/cost reports):
#   nise report ocp --static-report-file examples/ocp_vm/vm_static_data.yml \
#     --ocp-cluster-id <YOUR-CLUSTER-UUID> -s 2026-05-01 -e 2026-05-03 -w
#
# Per-VM parameters (see docs/ocp_vm_generator.md):
#   guest_agent (bool)           - populate guest-agent CSV columns
#   agent_install_hour (int)     - optional; agent starts N hours after start_date
#   agent_remove_day (int)       - optional; agent stops after day N from start_date
#   idle (bool)                  - low CPU/memory usage (notification 18)
#   abandoned (bool)             - zero usage all days (notification 43)
#   crash_loop (bool)            - high restart_count (notification 48)
#   windows_update_spike (bool)   - Windows P99>>P95 spread (notification 47)
#   downsize_unstable (bool)     - performance downsize held (notification 49)
#   oversized_for_instance_type (bool) - low usage on large VM; notification 41 with catalog
#   high_io (bool)               - disk IOPS above ROS_VM_HIGH_IOPS_THRESHOLD (notification 39)
#   fixed_usage (dict)           - cpu_pct, mem_pct steady load (kernel-reserve tests)
#   guest_os (str)               - linux, windows, or "" for unknown OS (notification 46)
#
# VirtualMachinePreference metadata is supplied via cluster_instance_types.json
# (preferences + vm_preferences), not VM YAML fields. Pair preference-server-vm with
# an operator upload mapping production/preference-server-vm -> server preference.
#
generators:
  - OCPVirtualMachineGenerator:
      start_date: 2026-05-01
      end_date: 2026-05-03
      vms:
        # Active Linux VM with guest agent
        - vm_name: web-server-linux-01
          namespace: production
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
        # Idle Linux VM with guest agent
        - vm_name: idle-vm-linux-01
          namespace: dev
          node_name: worker-3
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 40
          idle: true
        # Active Windows VM with guest agent
        - vm_name: db-server-windows-01
          namespace: production
          node_name: worker-2
          guest_os: windows
          guest_agent: true
          vcpu: 8
          memory_gib: 32
          disk_gib: 500
        # Active Linux VM without guest agent (empty guest-agent columns)
        - vm_name: legacy-app-01
          namespace: legacy
          node_name: worker-1
          guest_os: linux
          guest_agent: false
          vcpu: 2
          memory_gib: 4
          disk_gib: 50
        # Idle Windows VM without guest agent
        - vm_name: idle-windows-legacy-01
          namespace: legacy
          node_name: worker-2
          guest_os: windows
          guest_agent: false
          vcpu: 2
          memory_gib: 4
          disk_gib: 50
          idle: true
        # Guest agent appears 2 hours after report start (late install scenario)
        - vm_name: late-agent-install-vm
          namespace: production
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          agent_install_hour: 2
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
        # Guest agent for first 5 days only (removal scenario)
        - vm_name: agent-removed-vm
          namespace: staging
          node_name: worker-2
          guest_os: linux
          guest_agent: false
          agent_remove_day: 5
          vcpu: 2
          memory_gib: 4
          disk_gib: 50
        # Crash loop VM: elevated restart_count for ROS crash-loop notification (code 48)
        - vm_name: crash-loop-vm-01
          namespace: production
          node_name: worker-2
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
          crash_loop: true
        # Abandoned VM: zero CPU and memory usage for abandoned detection (ROS code 43)
        - vm_name: abandoned-test-vm-01
          namespace: forgotten-project
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 50
          abandoned: true
        # Windows VM with periodic update spikes (notification 47)
        - vm_name: windows-update-spike-vm
          namespace: production
          node_name: worker-2
          guest_os: windows
          guest_agent: true
          vcpu: 4
          memory_gib: 16
          disk_gib: 200
          windows_update_spike: true
        # VM with unstable downsize pattern (notification 49)
        - vm_name: downsize-unstable-vm
          namespace: staging
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          vcpu: 8
          memory_gib: 16
          disk_gib: 100
          downsize_unstable: true
        # VM with empty guest_os (notification 46)
        - vm_name: unknown-os-vm
          namespace: production
          node_name: worker-3
          guest_os: ""
          guest_agent: false
          vcpu: 2
          memory_gib: 4
          disk_gib: 50
        # Windows VM with fixed high usage (kernel reserve comparison)
        - vm_name: windows-high-usage-vm
          namespace: production
          node_name: worker-2
          guest_os: windows
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
          fixed_usage:
            cpu_pct: 0.70
            mem_pct: 0.85
        # Linux VM with same fixed usage (kernel reserve comparison pair)
        - vm_name: linux-high-usage-vm
          namespace: production
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
          fixed_usage:
            cpu_pct: 0.70
            mem_pct: 0.85
        # VM with idle GPU (passthrough)
        - vm_name: gpu-idle-vm
          namespace: ml-training
          guest_os: linux
          guest_agent: true
          vcpu: 16
          memory_gib: 64
          disk_gib: 500
          gpu_count: 1
          gpu_model: "NVIDIA A100-SXM4-80GB"
          gpu_utilization: idle
        # VM with underutilized MIG GPU
        - vm_name: gpu-underutil-mig-vm
          namespace: inference
          guest_os: linux
          guest_agent: true
          vcpu: 8
          memory_gib: 32
          disk_gib: 200
          gpu_count: 1
          gpu_model: "NVIDIA A100-SXM4-40GB"
          gpu_mig_profile: "3g.20gb"
          gpu_utilization: low
        # VM with saturated GPU
        - vm_name: gpu-saturated-vm
          namespace: ml-training
          guest_os: linux
          guest_agent: true
          vcpu: 32
          memory_gib: 128
          disk_gib: 1000
          gpu_count: 2
          gpu_model: "NVIDIA A100-SXM4-80GB"
          gpu_utilization: saturated
        # VM with well-utilized GPU
        - vm_name: gpu-healthy-vm
          namespace: inference
          guest_os: linux
          guest_agent: true
          vcpu: 8
          memory_gib: 32
          disk_gib: 200
          gpu_count: 1
          gpu_model: "NVIDIA T4"
          gpu_utilization: medium
        # Multi-GPU VM with mixed utilization (notification 54)
        - vm_name: multi-gpu-mixed-vm
          namespace: ml-training
          guest_os: linux
          guest_agent: true
          vcpu: 16
          memory_gib: 64
          disk_gib: 500
          gpu_count: 2
          gpu_devices:
            - uuid: "GPU-aaa-111"
              model: "NVIDIA A100-SXM4-80GB"
              utilization: high
            - uuid: "GPU-bbb-222"
              model: "NVIDIA A100-SXM4-80GB"
              utilization: idle
        # Variable CPU load for adaptive margin testing
        - vm_name: variable-cpu-vm
          namespace: batch-jobs
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
          cpu_pattern: variable
        # u1.medium-shaped VM for current_instance_type
        - vm_name: u1-medium-vm
          namespace: production
          guest_os: linux
          guest_agent: true
          vcpu: 1
          memory_gib: 2
          disk_gib: 30
          fixed_usage:
            cpu_pct: 0.35
            mem_pct: 0.55
        # Oversized VM for instance-type recommendation (notification 41)
        - vm_name: instance-type-rec-01
          namespace: vm-notifications
          node_name: worker-2
          guest_os: linux
          guest_agent: true
          vcpu: 8
          memory_gib: 16
          disk_gib: 100
          oversized_for_instance_type: true
        # High disk I/O (notification 39)
        - vm_name: high-io-vm-01
          namespace: vm-notifications
          node_name: worker-2
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
          high_io: true
        # Network-saturated workload for n1 recommendations (notification 55)
        - vm_name: network-heavy-vm-01
          namespace: vm-notifications
          node_name: worker-2
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 16
          disk_gib: 100
          network_heavy: true
          fixed_usage:
            cpu_pct: 0.35
            mem_pct: 0.50
        # Pair with cluster_instance_types.json vm_preferences for preference API fields
        - vm_name: preference-server-vm
          namespace: production
          node_name: worker-1
          guest_os: linux
          guest_agent: true
          vcpu: 4
          memory_gib: 8
          disk_gib: 100
          fixed_usage:
            cpu_pct: 0.45
            mem_pct: 0.60
