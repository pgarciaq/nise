---
# OCP static report for quota recommendation E2E.
# High pod requests inflate ResourceQuota hard sums; low usage and explicit
# resource_quota used values exercise the quota plugin tighten/raise paths.
#
# Declared vs defaulted (#825): this fixture declares only the cpu and memory
# *used* values below. Everything else in the namespace quota columns is
# nise's synthetic default, not a value chosen to exercise a path:
#   storage_request_namespace_hard  50 GiB            (53687091200.0 bytes)
#   storage_request_namespace_used  hard x U(0.3,0.85), redrawn per row
#   pods_namespace_hard/_used       50 / 30
#   object_count_namespace_hard/_used 100 / 50
#   quota_name                      "compute-quota"
# These are deliberate: blanket-declaring numbers would trade invented
# defaults for arbitrary picks. Declare the storage/pod/object quotas here
# when an E2E needs to assert those recommendations; the values are listed in
# docs-site/testing/test-data-recipes.md (ros-ocp-backend).
#
# Use with generate_nise_data(..., iqe_template="ocp_report_quota.yml", include_ros=True)
generators:
  - OCPGenerator:
      start_date: last_month
      end_date: today
      nodes:
        - node:
          node_name: quota-worker-1
          cpu_cores: 32
          memory_gig: 64
          resource_id: quota-node-1
          namespaces:
            quota-e2e-ns:
              resource_quota:
                cpu_request_used: 2.0
                cpu_limit_used: 4.0
                memory_request_used_gig: 4
                memory_limit_used_gig: 8
              pods:
                - pod:
                  pod_name: quota-heavy-1
                  cpu_request: 20
                  mem_request_gig: 8
                  cpu_limit: 24
                  mem_limit_gig: 12
                  cpu_usage:
                    full_period: 0.5
                  mem_usage_gig:
                    full_period: 1.0
                  labels: label_app:quota-e2e|label_environment:test
                  workload: deployment
                  replica_count: 2
                - pod:
                  pod_name: quota-heavy-2
                  cpu_request: 15
                  mem_request_gig: 6
                  cpu_limit: 18
                  mem_limit_gig: 10
                  cpu_usage:
                    full_period: 0.4
                  mem_usage_gig:
                    full_period: 0.8
                  labels: label_app:quota-e2e|label_environment:test
                  workload: deployment
